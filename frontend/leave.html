<!DOCTYPE html>
<html>
<head>
    <title>Smart Hostel - Leave Request</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h2>🏠 <span>SmartHostel</span></h2>
            <small>Xeno Service Portal</small>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard"><i class="fas fa-th-large"></i> Dashboard</a></li>
            <li><a href="/menu"><i class="fas fa-utensils"></i> Food Menu</a></li>
            <li><a href="/complaints"><i class="fas fa-exclamation-triangle"></i> Complaints <span class="badge" id="complaintBadge">0</span></a></li>
            <li><a href="/leave" class="active"><i class="fas fa-calendar-alt"></i> Leave <span class="badge" id="leaveBadge">0</span></a></li>
            <li><a href="/visitor"><i class="fas fa-users"></i> Visitor</a></li>
            <li><a href="/feedback"><i class="fas fa-star"></i> Feedback</a></li>
            <li><a href="/facilities"><i class="fas fa-building"></i> Facilities</a></li>
            <li><a href="/profile"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="/admin"><i class="fas fa-crown"></i> Admin Panel</a></li>
            <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
        <div class="sidebar-footer">
            <p>© 2024 SmartHostel</p>
        </div>
    </div>

    <div class="main-content">
        <header class="top-header">
            <div>
                <h1>📅 Leave Request</h1>
                <p>Request leave from hostel</p>
            </div>
            <div class="header-right">
                <span class="date-time" id="currentDateTime"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="card">
            <div class="card-header"><h3>📅 Leave Request</h3></div>
            <div class="card-body">
                <form id="leaveForm">
                    <div class="form-group">
                        <label>From Date</label>
                        <input type="date" id="leaveFrom" required>
                    </div>
                    <div class="form-group">
                        <label>To Date</label>
                        <input type="date" id="leaveTo" required>
                    </div>
                    <div class="form-group">
                        <label>Reason</label>
                        <input type="text" id="leaveReason" placeholder="Reason for leave">
                    </div>
                    <button type="submit">📤 Submit</button>
                </form>
                <div id="leaveMessage" class="message-box"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>📅 My Leaves</h3></div>
            <div class="card-body" id="leaveList">Loading...</div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem('loggedIn')) window.location.href = '/';

        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDateTime').textContent = 
                now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        function logout() {
            fetch('/api/logout', { method: 'POST' });
            sessionStorage.clear();
            window.location.href = '/';
        }

        async function fetchAPI(url, options = {}) {
            try {
                const res = await fetch(url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers }
                });
                return await res.json();
            } catch (e) {
                console.error('Error:', e);
                return null;
            }
        }

        async function loadLeave() {
            const leaves = await fetchAPI('/api/leave');
            if (leaves) {
                let html = '';
                if (leaves.length > 0) {
                    leaves.forEach(l => {
                        html += `<div class="complaint-item">
                            <div class="complaint-header">
                                <span class="complaint-title">${l.reason || 'Leave'}</span>
                                <span class="status-${l.status}">${l.status}</span>
                            </div>
                            <div class="complaint-meta">📅 ${l.from_date} to ${l.to_date}</div>
                        </div>`;
                    });
                } else {
                    html = '<div class="empty-state">📭 No leaves</div>';
                }
                document.getElementById('leaveList').innerHTML = html;

                const stats = await fetchAPI('/api/stats');
                if (stats) {
                    document.getElementById('complaintBadge').textContent = stats.total_complaints || 0;
                    document.getElementById('leaveBadge').textContent = stats.leave_requests || 0;
                }
            }
        }

        document.getElementById('leaveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                from_date: document.getElementById('leaveFrom').value,
                to_date: document.getElementById('leaveTo').value,
                reason: document.getElementById('leaveReason').value
            };
            
            const msg = document.getElementById('leaveMessage');
            msg.className = 'message-box';
            msg.textContent = '⏳ Submitting...';
            msg.style.display = 'block';
            
            const result = await fetchAPI('/api/leave', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            
            if (result && result.success) {
                msg.className = 'message-box success';
                msg.textContent = '✅ ' + result.message;
                this.reset();
                loadLeave();
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            } else {
                msg.className = 'message-box error';
                msg.textContent = '❌ ' + (result?.error || 'Failed');
            }
        });

        loadLeave();
    </script>

</body>
</html>
