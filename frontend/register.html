<!DOCTYPE html>
<html>
<head>
    <title>Smart Hostel - Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="register-page">
        <div class="register-box">
            <div class="logo">
                <div class="logo-icon">🏠</div>
                <h1>Create Account</h1>
                <p>Join Smart Hostel today!</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>🎓 Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter student ID" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>📱 Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter phone number">
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>🏠 Hostel</label>
                        <select id="hostel">
                            <option value="Boys Hostel A">Boys Hostel A</option>
                            <option value="Boys Hostel B">Boys Hostel B</option>
                            <option value="Girls Hostel A">Girls Hostel A</option>
                            <option value="Girls Hostel B">Girls Hostel B</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>📚 Branch</label>
                        <select id="branch">
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Electrical">Electrical</option>
                        </select>
                    </div>
                </div>
                <button type="submit">🚀 Register</button>
            </form>

            <div id="message"></div>

            <div class="login-link">
                Already have account? <a href="/">Login here</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var name = document.getElementById('name').value;
            var studentId = document.getElementById('studentId').value;
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;
            var password = document.getElementById('password').value;
            var hostel = document.getElementById('hostel').value;
            var branch = document.getElementById('branch').value;
            
            var formData = new FormData();
            formData.append('name', name);
            formData.append('student_id', studentId);
            formData.append('email', email);
            formData.append('phone', phone);
            formData.append('password', password);
            formData.append('hostel_name', hostel);
            formData.append('branch', branch);
            
            var msgDiv = document.getElementById('message');
            
            try {
                var response = await fetch('/api/register', {
                    method: 'POST',
                    body: formData
                });
                
                var data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'success';
                    msgDiv.textContent = '✅ ' + data.message + ' Redirecting...';
                    setTimeout(function() {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    msgDiv.className = 'error';
                    msgDiv.textContent = '❌ ' + data.error;
                }
            } catch (error) {
                msgDiv.className = 'error';
                msgDiv.textContent = '❌ Server error!';
                console.error(error);
            }
        });
    </script>
</body>
</html>
