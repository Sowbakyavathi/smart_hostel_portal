<!DOCTYPE html>
<html>
<head>
    <title>Smart Hostel - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon">🏠</div>
                <h1>Smart Hostel</h1>
                <p>Manage your hostel life efficiently</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" id="name" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">🚀 Sign In</button>
            </form>
            
            <div id="message"></div>
            
            <div class="register-link">
                Don't have an account? <a href="/register">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var name = document.getElementById('name').value;
            var password = document.getElementById('password').value;
            
            var formData = new FormData();
            formData.append('name', name);
            formData.append('password', password);
            
            var msgDiv = document.getElementById('message');
            
            try {
                var response = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });
                
                var data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'success';
                    msgDiv.textContent = '✅ Login successful!';
                    sessionStorage.setItem('loggedIn', 'true');
                    setTimeout(function() {
                        window.location.href = data.role === 'admin' ? '/admin' : '/dashboard';
                    }, 500);
                } else {
                    msgDiv.className = 'error';
                    msgDiv.textContent = '❌ ' + data.error;
                }
            } catch (error) {
                msgDiv.className = 'error';
                msgDiv.textContent = '❌ Server not running!';
                console.error(error);
            }
        });
    </script>
</body>
</html>
